<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>app qua môn</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="mobile.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400..700;1,400..700&family=EB+Garamond:ital,wght@0,400..700;1,400..700&family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..700&family=Lora:ital,wght@0,400..700;1,400..700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Playfair+Display:ital,wght@0,400..700;1,400..700&display=swap"
        rel="stylesheet">
    <script>
        (function () {
            try {
                var t = localStorage.getItem("ontaptriet_theme");
                if (t === "dark" || !t) document.documentElement.setAttribute("data-theme", "dark");
            } catch (e) { }
        })();
    </script>
</head>

<body>
    <!-- Màn hình Loading ASCII lúc tải trang (2 giây) -->
    <div class="page-loader" id="page-loader">
        <span class="loader-spinner" id="loader-spinner">/</span>
    </div>

    <!-- Background Live Wallpaper -->
    <div id="live-wallpaper-container" class="live-wallpaper-container">
        <video id="live-wallpaper-video" class="live-wallpaper-video" loop muted playsinline></video>
    </div>

    <div class="canvas-wrapper">
        <!-- Điểm neo: TOP CENTER -->
        <header class="anchor-top-center" id="brand-header">
            <div class="brand-title" id="brand-title-content">
                Ontaptriet <span class="brand-version">v2.2</span>
            </div>
        </header>

        <!-- Điểm neo: CENTER (Menu chọn bài ôn) -->
        <main class="anchor-center" id="menu-screen">
            <!-- 1. Môn học (Component Dropdown) -->
            <div class="menu-row">
                <span class="menu-label-prefix">Môn học:</span>
                <div class="custom-dropdown" id="dropdown-subject">
                    <span class="dropdown-trigger">
                        <span class="label-viewport">
                            <span class="label-text-current">Kiến trúc máy tính</span>
                        </span>
                        <span class="dropdown-arrow">›</span>
                    </span>
                    <div class="dropdown-menu"></div>
                </div>
            </div>

            <!-- 2. Chương học (Component Dropdown) -->
            <div class="menu-row">
                <span class="menu-label-prefix">Chương:</span>
                <div class="custom-dropdown" id="dropdown-chapter">
                    <span class="dropdown-trigger">
                        <span class="label-viewport">
                            <span class="label-text-current">Tất cả</span>
                        </span>
                        <span class="dropdown-arrow">›</span>
                    </span>
                    <div class="dropdown-menu"></div>
                </div>
            </div>

            <!-- 3. Chế độ (Random cả đề) -->
            <div class="menu-row">
                <span class="menu-label-prefix">Chế độ:</span>
                <button id="random-toggle-btn" class="btn-random-toggle active" type="button">Random cả đề</button>
            </div>

            <!-- 4A. Số lượng câu (hiển thị khi Random BẬT) -->
            <div class="menu-row" id="row-limit">
                <span class="menu-label-prefix">Số lượng câu:</span>
                <div class="limit-options" id="limit-options">
                    <span class="limit-choice" data-value="5">5 câu</span>
                    <span class="limit-choice active" data-value="25">25 câu</span>
                    <span class="limit-choice" data-value="50">50 câu</span>
                    <span class="limit-choice" data-value="all">Tất cả</span>
                </div>
            </div>

            <!-- 4B. Nhập phạm vi câu (hiển thị khi Random TẮT) -->
            <div class="menu-row" id="row-range" style="display: none;">
                <span class="menu-label-prefix">Phạm vi câu:</span>
                <div class="exam-range-wrapper">
                    <span class="range-prefix-text">Từ câu</span>
                    <input type="number" id="range-from" class="exam-input-field" value="1" min="1" />
                    <span class="range-separator-text">đến câu</span>
                    <input type="number" id="range-to" class="exam-input-field" value="25" min="1" />
                    <span class="range-total-hint" id="range-total-hint"></span>
                </div>
            </div>

            <!-- Hàng nút hành động -->
            <div class="menu-actions">
                <button id="start-btn" class="btn-action btn-primary">
                    <span class="btn-label">Bắt đầu</span> <span class="btn-arrow">›</span>
                </button>
                <button id="history-btn" class="btn-action btn-secondary">
                    Xem lịch sử
                </button>
                <span class="action-separator">/</span>
                <button id="settings-btn" class="btn-action btn-secondary">
                    Cài đặt
                </button>
            </div>
        </main>

        <!-- Màn hình Làm bài -->
        <section class="anchor-center" id="quiz-screen" style="display: none;"></section>

        <!-- Màn hình Kết quả -->
        <section class="anchor-center" id="result-screen" style="display: none;"></section>

        <!-- Màn hình Lịch sử -->
        <section class="anchor-center" id="history-screen" style="display: none;"></section>

        <!-- Màn hình Chi tiết câu sai của lịch sử -->
        <section class="anchor-center" id="history-detail-screen" style="display: none;"></section>

        <!-- Màn hình Cài đặt -->
        <section class="anchor-center" id="settings-screen" style="display: none;">
            <div class="settings-container">
                <!-- 1. Giao diện (Sáng / Tối) -->
                <div class="menu-row">
                    <span class="menu-label-prefix">Giao diện:</span>
                    <button id="theme-toggle-btn" class="btn-action btn-secondary btn-theme-toggle" type="button">
                        <span class="label-viewport" id="theme-label-viewport">
                            <span class="label-text-current">Tối</span>
                        </span>
                    </button>
                </div>

                <!-- 2. Phông chữ (Dropdown) -->
                <div class="menu-row">
                    <span class="menu-label-prefix">Phông chữ:</span>
                    <div class="custom-dropdown font-dropdown" id="dropdown-font">
                        <span class="dropdown-trigger">
                            <span class="label-viewport">
                                <span class="label-text-current">Times New Roman</span>
                            </span>
                            <span class="dropdown-arrow">›</span>
                        </span>
                        <div class="dropdown-menu"></div>
                    </div>
                </div>

                <!-- 3. Hình nền động (Live Wallpaper) -->
                <div class="menu-row">
                    <span class="menu-label-prefix">Hình nền động:</span>
                    <button id="lw-toggle-btn" class="btn-action btn-secondary btn-theme-toggle" type="button">
                        <span class="label-viewport" id="lw-label-viewport">
                            <span class="label-text-current">Bật</span>
                        </span>
                    </button>
                </div>

                <!-- Nút Về menu chính -->
                <div class="menu-actions" style="margin-top: 28px;">
                    <button id="settings-back-btn" class="btn-action btn-nav" type="button">
                        <span class="btn-arrow">‹</span> <span class="btn-label">Về menu chính</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- Điểm neo: BOTTOM (Status Bar ở dưới cùng trang) -->
        <footer class="anchor-bottom-bar" id="quiz-status-bar">
            <div class="quiz-back-wrapper">
                <button id="quiz-back-btn" class="btn-quiz-back" type="button">
                    <span class="btn-arrow">‹</span> <span class="btn-label back-label">Quay lại</span>
                </button>
                <span class="action-separator">/</span>
                <button id="quiz-copy-btn" class="btn-quiz-copy" type="button" title="Copy câu hỏi và đáp án">
                    <span class="label-viewport" id="quiz-copy-viewport">
                        <span class="label-text-current">Copy câu hỏi này</span>
                    </span>
                </button>
            </div>
            <div class="quiz-index-center">
                <span class="quiz-index-text" id="quiz-index-text"></span>
            </div>
            <div class="quiz-status-spacer"></div>
        </footer>

        <!-- Copyright ở góc dưới cùng bên phải -->
        <div class="bottom-right-copyright" id="site-copyright">
            <span>ontaptriet design by @phucthanhh</span>
        </div>
    </div>

    <!-- Tầng dữ liệu & Logic cốt lõi -->
    <script src="scripts/config.js"></script>
    <script src="scripts/parser.js"></script>
    <script src="scripts/history.js"></script>
    <script src="scripts/quiz.js"></script>

    <!-- Module Component Dropdown -->
    <script src="scripts/dropdown.js"></script>

    <!-- Module Điều phối màn hình -->
    <script src="scripts/screen-switcher.js"></script>

    <!-- Các Module Giao diện (Views) -->
    <script src="scripts/loader.js"></script>
    <script src="scripts/theme.js"></script>
    <script src="scripts/wallpaper.js"></script>
    <script src="scripts/menu.js"></script>
    <script src="scripts/quiz-view.js"></script>
    <script src="scripts/result-view.js"></script>
    <script src="scripts/history-view.js"></script>
    <script src="scripts/settings-view.js"></script>
    <script src="scripts/easter-egg.js"></script>

    <!-- Điểm khởi chạy ứng dụng -->
    <script src="scripts/main.js"></script>
</body>

</html>
